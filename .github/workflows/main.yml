name: Dump Classes from IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Setup class-dump
      run: |
        curl -L -o /usr/local/bin/class-dump https://github.com/AloneMonkey/MonkeyDev/raw/master/bin/class-dump
        chmod +x /usr/local/bin/class-dump

    - name: Download IPA
      run: |
        # Получаем ссылку через API
        curl -s "https://api.github.com/repos/gst65wwy2x-hub/decompMine/releases/tags/v1.0" > release.json
        URL=$(python3 -c "import json,sys; data=json.load(sys.stdin); [print(a['browser_download_url']) for a in data['assets'] if '.ipa' in a['name']]")
        echo "Downloading: $URL"
        curl -L -o mcpe.ipa "$URL"
        ls -la mcpe.ipa

    - name: Extract and Dump
      run: |
        unzip -o mcpe.ipa -d out
        cd out/Payload/*.app
        BIN=$(file * | grep "Mach-O" | head -1 | cut -d: -f1)
        echo "Binary: $BIN"
        class-dump "$BIN" > $GITHUB_WORKSPACE/headers.txt 2>&1
        echo "Total lines: $(wc -l < $GITHUB_WORKSPACE/headers.txt)"

    - name: Show key classes
      run: |
        echo "=== Actor/Player/Mob/Entity ==="
        grep -i "interface.*actor\|interface.*player\|interface.*mob\|interface.*entity" headers.txt | head -50
        echo ""
        echo "=== AABB/Hitbox ==="
        grep -i "getAABB\|getHitbox\|aabb\|boundingBox\|getCollision" headers.txt | head -30
        echo ""
        echo "=== Render ==="
        grep -i "renderEntity\|renderPlayer\|LevelRender\|render" headers.txt | head -30
        echo ""
        echo "=== Level/Chunk ==="
        grep -i "interface.*level\|interface.*chunk\|interface.*block" headers.txt | head -30

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: headers
        path: headers.txt