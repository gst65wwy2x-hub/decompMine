name: Анализ IPA и сборка

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Скачиваем и устанавливаем class-dump
      run: |
        curl -L -o /usr/local/bin/class-dump https://github.com/AloneMonkey/MonkeyDev/raw/master/bin/class-dump
        chmod +x /usr/local/bin/class-dump
        echo "class-dump установлен!"

    - name: Скачиваем IPA
      run: |
        echo "Скачиваю IPA..."
        wget -O mcpe.ipa "https://github.com/gst65wwy2x-hub/decompMine/releases/download/v1.0/-.1.26.20.ipa" || {
          echo "Ошибка скачивания!"
          exit 1
        }
        echo "IPA скачан!"
        ls -lh mcpe.ipa

    - name: Распаковываем и анализируем IPA
      run: |
        echo "=== Начинаем анализ ==="
        unzip -o mcpe.ipa -d extracted
        cd extracted/Payload/
        
        APP_NAME=$(ls | grep ".app")
        echo "Найдено приложение: $APP_NAME"
        cd "$APP_NAME"
        
        BINARY=$(file * | grep "Mach-O" | head -1 | cut -d: -f1)
        if [ -z "$BINARY" ]; then
          BINARY=$(ls -lhS | grep -v "\.app\|\.plist\|\.png\|\.storyboardc\|\.nib\|\.car\|\.ttf\|\.otf\|\.momd\|\.metal" | head -2 | tail -1 | awk '{print $NF}')
        fi
        
        echo "Анализирую бинарник: $BINARY"
        mkdir -p ../../../headers/
        class-dump "$BINARY" > ../../../headers_raw.txt 2>&1 || {
          echo "class-dump не сработал, пробую dsdump..."
          curl -L -o /usr/local/bin/dsdump https://github.com/DerekSelander/dsdump/raw/master/dsdump
          chmod +x /usr/local/bin/dsdump
          dsdump "$BINARY" --objc > ../../../headers_raw.txt 2>&1
        }
        echo "=== Анализ завершён ==="
        echo "Строк в дампе:"
        wc -l ../../../headers_raw.txt
        echo ""
        echo "=== Первые 100 строк ==="
        head -100 ../../../headers_raw.txt

    - name: Показываем важные классы
      run: |
        echo "=== Классы Actor/Player/Mob ==="
        grep -i "interface.*actor\|interface.*player\|interface.*mob\|interface.*entity" headers_raw.txt | head -40
        echo ""
        echo "=== Методы AABB/хитбокс ==="
        grep -i "getAABB\|getHitbox\|getBoundingBox\|aabb" headers_raw.txt | head -20
        echo ""
        echo "=== Методы рендера ==="
        grep -i "renderEntities\|renderPlayer\|LevelRenderer" headers_raw.txt | head -20
        echo ""
        echo "=== Классы Level/Chunk/Block ==="
        grep -i "interface.*level\|interface.*chunk\|interface.*block\|interface.*world" headers_raw.txt | head -30
        echo ""
        echo "=== Классы Minecraft ==="
        grep -i "interface.*minecraft\|interface.*mcpe\|interface.*bedrock" headers_raw.txt | head -20

    - name: Upload Headers
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Headers
        path: |
          headers_raw.txt