name: Inject Dylib Simple

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile Dylib
      run: |
        clang -dynamiclib -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk -arch arm64 -miphoneos-version-min=14.0 -framework Foundation -framework UIKit -framework CoreGraphics -framework AVFoundation -framework QuartzCore Tweak.mm -o MinecraftCheat.dylib

    - name: Download IPA
      run: |
        curl -L -o mcpe.ipa "https://github.com/gst65wwy2x-hub/decompMine/releases/download/v1.0/-.1.26.20.ipa"

    - name: Inject
      run: |
        unzip mcpe.ipa -d out
        cp MinecraftCheat.dylib out/Payload/*.app/
        cd out/Payload/*.app
        BIN=$(file * | grep "Mach-O" | head -1 | cut -d: -f1)
        install_name_tool -change @rpath/libc++.1.dylib @executable_path/MinecraftCheat.dylib "$BIN" 2>/dev/null || true
        cd ../../..
        zip -r Patched.ipa Payload/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Patched-IPA
        path: Patched.ipa